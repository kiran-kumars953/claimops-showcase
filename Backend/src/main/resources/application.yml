spring:
  application:
    name: tpa-claims-processing-backend

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tpa_claims_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mvc:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    root: INFO
    com.tpa.claims: DEBUG
    org.springframework.security: INFO
    org.hibernate: WARN

  file:
    name: logs/tpa-claims.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


# ============================
# Application Custom Config
# ============================

app:

  name: TPA Claims Processing Backend
  version: 1.0.0

  storage:
    upload-dir: storage

  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-at-least-32-chars}
    expiration: 86400000

  python-service:
    url: http://localhost:5000
    timeout: 30000
    max-retries: 3

  file-types:
    allowed: pdf,jpg,jpeg,png


# ============================
# Swagger / OpenAPI
# ============================

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

  api-docs:
    path: /api-docs


# ============================
# DEV PROFILE
# ============================

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/tpa_claims_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

logging:
  level:
    root: INFO
    com.tpa.claims: DEBUG


# ============================
# PROD PROFILE
# ============================

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tpa_claims}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

app:
  jwt:
    secret: ${JWT_SECRET}

  storage:
    upload-dir: ${UPLOAD_DIR:/data/storage}

  python-service:
    url: ${PYTHON_SERVICE_URL:http://python-service:5000}

logging:
  level:
    root: WARN
    com.tpa.claims: INFO
